name: Deploy
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-strato
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Setup node and install dependencies
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - name: Build application
              run: npm run build
              shell: bash
            - name: Verify static export
              run: test -s out/index.html
            - name: Deploy artifacts
              uses: wlixcc/SFTP-Deploy-Action@v1.2.5
              with:
                  username: ${{ secrets.STRATO_USERNAME }}
                  server: "ssh.strato.de"
                  port: 22
                  local_path: "./out/*"
                  remote_path: "/home/${{ secrets.STRATO_USERNAME }}/www/"
                  ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
