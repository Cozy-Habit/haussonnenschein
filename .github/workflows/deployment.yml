name: Deploy
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-strato
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Setup node and install dependencies
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - name: Build application
              run: npm run build
              shell: bash
            - name: Verify static export
              run: test -s out/index.html
            # Automatically upload files to STRATO via SFTP
            - name: SFTP Deploy
              uses: wlixcc/SFTP-Deploy-Action@v1.2.6
              with:
                  server: ${{ secrets.STRATO_SERVER }}
                  username: ${{ secrets.STRATO_USERNAME }}
                  port: 22
                  password: ${{ secrets.STRATO_PASSWORD }}
                  local_path: "./out/*"
                  remote_path: "/home/${{ secrets.STRATO_USERNAME }}/www/"
                  sftp_only: true
                  sftpArgs: "-vvv"
