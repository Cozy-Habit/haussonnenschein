name: Deploy
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-strato
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Setup node and install dependencies
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - name: Build application
              run: npm run build
              shell: bash
            - name: Verify static export
              run: test -s out/index.html
            # Automatically upload files to STRATO via SFTP
            - name: SFTP Deploy
              uses: SamKirkland/FTP-Deploy-Action@v4.3.5
              with:
                  server: ${{ secrets.STRATO_SERVER }}
                  username: ${{ secrets.STRATO_USERNAME }}
                  password: ${{ secrets.STRATO_PASSWORD }}
                  port: 22 # Standard SFTP port
                  # Change 'local-dir' if your static files are generated in a folder like './dist' or './build'
                  local-dir: "./out/"
                  # Target path inside your STRATO server. Default root directory is usually sufficient.
                  server-dir: "/home/${{ secrets.STRATO_USERNAME }}/www/"
                  # Prevents older, unneeded files from piling up on the webserver
                  delete-clean: false
