name: Deploy
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-strato
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Setup node and install dependencies
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - name: Build application
              run: npm run build
              shell: bash
            - name: Verify static export
              run: test -s out/index.html
            # Automatically upload files to STRATO via SFTP
            - name: SFTP Deploy
              uses: Dylan700/sftp-upload-action@latest
              with:
                  server: ${{ secrets.SFTP_SERVER }} # Value: ssh.strato.de (or your specific STRATO SFTP server name)
                  username: ${{ secrets.SFTP_USERNAME }} # Your STRATO SFTP login
                  password: ${{ secrets.SFTP_PASSWORD }} # Your STRATO SFTP password
                  port: 22 # Pure SFTP port
                  uploads: ./out/ => "/home/${{ secrets.STRATO_USERNAME }}/www/" # Absolute path to your files inside GitHub runner
                  delete: true
